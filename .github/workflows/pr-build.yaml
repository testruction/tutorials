name: PR container image build

# Builds the container images changed by the pull request, without pushing.
# Adapted from alithya-oss/containers. The build cache is scoped per image and
# shared with the push workflows of the default branch.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect changed images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.detect.outputs.images }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
      - name: List changed images
        id: detect
        run: node .github/scripts/list-changed-images.ts
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}

  build:
    name: Build ${{ matrix.image }} (no push)
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.detect.outputs.images) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0
      - uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: ${{ matrix.image }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  # Single required status check: the matrix legs have variable names.
  result:
    name: PR build result
    if: always()
    runs-on: ubuntu-latest
    needs: [detect, build]
    steps:
      - name: Verify no build failed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "A required job failed or was cancelled."
            exit 1
          fi
          echo "All changed images built successfully (or none needed building)."
