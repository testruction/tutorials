name: Hadolint Dockerfile lint

# Lints the Dockerfiles of the container images changed by the pull request.
# Every finding is an inline annotation; .hadolint.yaml sets the failure
# threshold (error) and the ignored rules.
# Adapted from alithya-oss/containers.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hadolint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect changed images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.detect.outputs.images }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
      - name: List changed images
        id: detect
        run: node .github/scripts/list-changed-images.ts
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}

  hadolint:
    name: Lint ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.detect.outputs.images) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: ${{ matrix.image }}/Dockerfile
          config: .hadolint.yaml
          failure-threshold: error

  # Single required status check: the matrix legs have variable names.
  result:
    name: Hadolint result
    if: always()
    runs-on: ubuntu-latest
    needs: [detect, hadolint]
    steps:
      - name: Verify no lint job failed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "A required job failed or was cancelled."
            exit 1
          fi
          echo "All changed Dockerfiles linted clean (or none needed linting)."
