name: Argo Workflows playground - Backstage image

# Builds backstage/00-argo-workflows-playground/containers/backstage/Dockerfile
# on the default branch and pushes it to
#   ghcr.io/<owner>/argo-workflows-playground/backstage:{latest,sha-<commit>}
# Pull requests are validated by hadolint.yaml and pr-build.yaml.

on:
  push:
    branches: [main]
    paths:
      - backstage/00-argo-workflows-playground/containers/backstage/**
      - .github/workflows/argo-workflows-playground-backstage.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/argo-workflows-playground/backstage
  CONTEXT: backstage/00-argo-workflows-playground/containers/backstage

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: ${{ env.CONTEXT }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Same cache scope as pr-build.yaml
          cache-from: type=gha,scope=${{ env.CONTEXT }}
          cache-to: type=gha,scope=${{ env.CONTEXT }},mode=max
