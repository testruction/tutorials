name: Argo Workflows playground - Backstage image

# Builds backstage/00-argo-workflows-playground/containers/backstage/Dockerfile.
# Pull requests only build the image; the default branch also pushes it to
#   ghcr.io/<owner>/argo-workflows-playground/backstage:{latest,sha-<commit>}

on:
  push:
    branches: [main]
    paths:
      - backstage/00-argo-workflows-playground/containers/backstage/**
      - .github/workflows/argo-workflows-playground-backstage.yaml
  pull_request:
    paths:
      - backstage/00-argo-workflows-playground/containers/backstage/**
      - .github/workflows/argo-workflows-playground-backstage.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/argo-workflows-playground/backstage

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=pr

      - uses: docker/build-push-action@v6
        with:
          context: backstage/00-argo-workflows-playground/containers/backstage
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
