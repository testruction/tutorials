# Docs https://packaging.python.org/en/latest/tutorials/packaging-projects/
[metadata]
name = fakenamesservice
version = file: VERSION
description = A python package to demonstrate MVC pattern implementation with Flask and Dash
long_description = file: README.md
license = MIT
url = https://github.com/testruction/fakenamesservice
author = Florian JUDITH
author_email = florian.judith.b@gmail.com
keywords =
    webservice
    mvc
    backend

classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
python_requires = >=3.8

install_requires =
    jwt
    pandas
    fastapi
    uvicorn
    jinja2
    botocore
    pg8000
    sqlalchemy-cockroachdb
    opentelemetry-sdk-extension-aws
    opentelemetry-propagator-aws-xray
    opentelemetry-exporter-otlp
    opentelemetry-instrumentation-botocore
    opentelemetry-instrumentation-dbapi
    opentelemetry-instrumentation-fastapi
    opentelemetry-instrumentation-logging

tests_require =
    pytest
    tox
    httpx

[options.package_data]
* = *.json, *.yaml, *.csv, *.sql, VERSION, *.j2, README.md, *.css


[options.packages.find]
where = .


[tool.pytest]
minversion = 6.0
addopts = -ra -q
log_cli = true
log_cli_level = INFO
# asyncio_mode = "auto"
env_files =
    .env

[flake8]
ignore = E501