# Backstage + Argo Workflows playground - environment provisioning
version: '3'

vars:
  ARGO_WORKFLOWS_PORT: 2746
  BACKSTAGE_CHART_VERSION: 2.11.0

tasks:
  default:
    desc: Provision the tutorial environment
    cmds:
      - task: install:helm
      - task: deploy:metallb
      - task: deploy:argo-workflows
      - task: deploy:apps

  deploy:apps:
    desc: Deploy the applications in parallel
    deps:
      - deploy:demo
      - deploy:backstage

  install:helm:
    desc: Upgrade the Helm client
    cmds:
      - curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - ln -sf /usr/local/bin/helm /usr/bin/helm
      - touch /ks/.helm_finished

  deploy:metallb:
    desc: Deploy MetalLB and give it the host IP address as address pool
    vars:
      IP_ADDRESS:
        sh: ip route get 1.1.1.1 | grep -oP 'src \K[^ ]+'
    cmds:
      - helm repo add metallb https://metallb.github.io/metallb
      - helm repo update
      - helm upgrade --install metallb metallb/metallb --namespace metallb-system --create-namespace --wait
      - |
          kubectl apply -f - <<EOF
          apiVersion: metallb.io/v1beta1
          kind: IPAddressPool
          metadata:
            name: default
            namespace: metallb-system
          spec:
            addresses:
              - {{.IP_ADDRESS}}/32
          ---
          apiVersion: metallb.io/v1beta1
          kind: L2Advertisement
          metadata:
            name: default
            namespace: metallb-system
          spec:
            ipAddressPools:
              - default
          EOF
      - touch /ks/.metallb_finished

  deploy:argo-workflows:
    desc: Deploy Argo Workflows and a read-only account for Backstage
    cmds:
      - helm repo add argo https://argoproj.github.io/argo-helm
      - helm repo update
      - |
          helm upgrade --install argo-workflows argo/argo-workflows \
            --namespace argo --create-namespace --wait \
            --values - <<EOF
          crds:
            # Minified CRDs: no pre-install hook job
            full: false
          server:
            # "server": the web console needs no login. "client": the Backstage plugin sends a service account token.
            authModes:
              - server
              - client
            serviceType: LoadBalancer
            servicePort: {{.ARGO_WORKFLOWS_PORT}}
            serviceAnnotations:
              metallb.io/allow-shared-ip: edge-endpoint
          EOF
      - kubectl apply -f ${HOME}/deploy/argo-workflows/backstage-rbac.yaml
      - touch /ks/.argo-workflows_finished

  deploy:demo:
    desc: Run the demo workflows (a cron pipeline and a failing workflow)
    cmds:
      - kubectl apply -f ${HOME}/deploy/argo-workflows/demo-rbac.yaml
      - kubectl apply -f ${HOME}/deploy/argo-workflows/cron-workflow.yaml
      - kubectl create -f ${HOME}/deploy/argo-workflows/failing-workflow.yaml
      - touch /ks/.demo_finished

  deploy:backstage:
    desc: Deploy Backstage and its PostgreSQL database with the Backstage Helm chart
    vars:
      KC_BACKSTAGE_URL:
        sh: sed 's/PORT/7007/' /etc/killercoda/host
    cmds:
      - kubectl create namespace backstage --dry-run=client -o yaml | kubectl apply -f -
      - |
          # Generated once: re-running the task keeps the password of the existing database
          kubectl -n backstage get secret backstage-postgresql > /dev/null 2>&1 || kubectl -n backstage create secret generic backstage-postgresql \
            --from-literal=admin-password="$(head -c 18 /dev/urandom | base64)" \
            --from-literal=user-password="$(head -c 18 /dev/urandom | base64)"
      - |
          # Base URL seen by the browser, and token of the read-only Argo Workflows account
          kubectl -n backstage create secret generic backstage-env \
            --from-literal=BACKSTAGE_BASE_URL={{.KC_BACKSTAGE_URL}} \
            --from-literal=ARGO_WORKFLOWS_TOKEN="$(kubectl -n argo get secret backstage-token -o jsonpath='{.data.token}' | base64 -d)" \
            --dry-run=client -o yaml | kubectl apply -f -
      - |
          kubectl -n backstage create configmap backstage-catalog \
            --from-file=${HOME}/deploy/backstage/catalog-info.yaml \
            --dry-run=client -o yaml | kubectl apply -f -
      - helm repo add backstage https://backstage.github.io/charts
      - helm repo update
      - |
          helm upgrade --install backstage backstage/backstage \
            --version {{.BACKSTAGE_CHART_VERSION}} \
            --namespace backstage --wait --timeout 10m \
            --values ${HOME}/deploy/backstage/values.yaml
      - touch /ks/.backstageapp_finished
