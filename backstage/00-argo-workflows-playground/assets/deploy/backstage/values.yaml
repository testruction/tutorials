# Values of the Backstage Helm chart (https://github.com/backstage/charts) for the playground.
# The image is built by containers/backstage/Dockerfile and loads its own configuration:
# app-config.yaml and app-config.playground.yaml.
backstage:
  image:
    registry: ghcr.io
    repository: testruction/argo-workflows-playground/backstage
    tag: latest
  args:
    - --config
    - app-config.yaml
    - --config
    - app-config.playground.yaml
  extraEnvVars:
    - name: ARGO_WORKFLOWS_URL
      value: http://argo-workflows-server.argo:2746
  # BACKSTAGE_BASE_URL and ARGO_WORKFLOWS_TOKEN
  extraEnvVarsSecrets:
    - backstage-env
  # Catalog entities of the playground
  extraVolumes:
    - name: catalog
      configMap:
        name: backstage-catalog
  extraVolumeMounts:
    - name: catalog
      mountPath: /app/catalog
  # Helm starts Backstage and PostgreSQL together, and Backstage fails if the database is not reachable
  initContainers:
    - name: wait-for-postgresql
      image: busybox:1.37
      command: [sh, -c, 'until nc -z backstage-postgresql 5432; do echo "Waiting for PostgreSQL"; sleep 2; done']
  # The first start creates the schemas of every plugin: allow up to 5 minutes
  startupProbe:
    httpGet:
      path: /.backstage/health/v1/liveness
      port: 7007
    periodSeconds: 10
    failureThreshold: 30
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
service:
  type: LoadBalancer
  annotations:
    metallb.io/allow-shared-ip: edge-endpoint
# Minimal PostgreSQL (Bitnami subchart): one instance, small volume.
# The chart passes POSTGRES_HOST, POSTGRES_PORT, POSTGRES_USER and POSTGRES_PASSWORD to Backstage.
postgresql:
  enabled: true
  architecture: standalone
  auth:
    username: backstage
    database: backstage
    # Created by the Taskfile, with the admin-password and user-password keys
    existingSecret: backstage-postgresql
  primary:
    persistence:
      storageClass: local-path
      size: 1Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
