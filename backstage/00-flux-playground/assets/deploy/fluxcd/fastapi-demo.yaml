---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: fastapi-demo
  namespace: flux-system
spec:
  ignore: |
    # exclude all
    /*
    # include charts directory
    !/apps/fastapi-demo/
  interval: 1m
  ref:
    branch: main
  secretRef:
    name: flux-system
  timeout: 60s
  url: https://github.com/testruction/fleet-infra-public
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fastapi-demo
  namespace: flux-system
spec:
  force: false
  interval: 5m
  path: ./apps/fastapi-demo/localhost
  prune: true
  sourceRef:
    kind: GitRepository
    name: fastapi-demo
    namespace: flux-system
