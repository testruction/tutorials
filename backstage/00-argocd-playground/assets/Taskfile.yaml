# Backstage + Argo CD playground - environment provisioning
version: '3'

vars:
  YQ_VERSION: 4.46.1
  NODE_MAJOR: 24
  PROMETHEUS_CRDS_VERSION: 22.0.1
  ARGOCD_ADMIN_PASSWORD: admin

tasks:
  default:
    desc: Provision the tutorial environment
    cmds:
      - task: install:helm
      - task: install:yq
      - task: install:nodejs
      - task: install:locust
      - task: deploy:crds
      - task: deploy:metallb
      - task: deploy:argocd
      - task: deploy:apps

  deploy:apps:
    desc: Deploy the applications in parallel
    deps:
      - deploy:prometheus
      - deploy:metrics-server
      - deploy:webapp
      - setup:backstage

  install:helm:
    desc: Upgrade the Helm client
    cmds:
      - curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - ln -sf /usr/local/bin/helm /usr/bin/helm
      - touch /ks/.helm_finished

  install:yq:
    desc: Install the yq command line
    cmds:
      - sudo curl -fsSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v{{.YQ_VERSION}}/yq_linux_amd64
      - sudo chmod +x /usr/local/bin/yq
      - touch /ks/.yq_finished

  install:nodejs:
    desc: Install Node.js and Yarn 4 (Corepack)
    cmds:
      - curl -fsSL https://deb.nodesource.com/setup_{{.NODE_MAJOR}}.x | sudo -E bash -
      - sudo apt-get install -y nodejs build-essential python3
      - sudo npm install --global corepack
      - sudo corepack enable
      - touch /ks/.nodejs_finished

  install:locust:
    desc: Install the Locust.io load generator
    cmds:
      - sudo apt-get install -yqq python3-locust httpie
      - touch /ks/.locust_finished

  deploy:crds:
    desc: Deploy the Prometheus Operator CRDs
    cmds:
      - helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
      - helm repo update
      - helm upgrade --install prometheus-operator-crds prometheus-community/prometheus-operator-crds --version {{.PROMETHEUS_CRDS_VERSION}}
      - touch /ks/.crds_finished

  deploy:metallb:
    desc: Deploy MetalLB and give it the host IP address as address pool
    vars:
      IP_ADDRESS:
        sh: ip route get 1.1.1.1 | grep -oP 'src \K[^ ]+'
    cmds:
      - helm repo add metallb https://metallb.github.io/metallb
      - helm repo update
      - helm upgrade --install metallb metallb/metallb --namespace metallb-system --create-namespace --wait
      - |
          kubectl apply -f - <<EOF
          apiVersion: metallb.io/v1beta1
          kind: IPAddressPool
          metadata:
            name: default
            namespace: metallb-system
          spec:
            addresses:
              - {{.IP_ADDRESS}}/32
          ---
          apiVersion: metallb.io/v1beta1
          kind: L2Advertisement
          metadata:
            name: default
            namespace: metallb-system
          spec:
            ipAddressPools:
              - default
          EOF
      - touch /ks/.metallb_finished

  argocd:cli:
    desc: Install the Argo CD command line
    cmds:
      - sudo curl -fsSL -o /usr/local/bin/argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
      - sudo chmod +x /usr/local/bin/argocd

  argocd:install:
    desc: Install Argo CD with Helm
    cmds:
      - helm repo add argo https://argoproj.github.io/argo-helm
      - helm repo update
      - |
          ADMIN_BCRYPT=$(argocd account bcrypt --password {{.ARGOCD_ADMIN_PASSWORD}})
          helm upgrade --install gitops argo/argo-cd \
            --namespace argo-cd --create-namespace --wait \
            --values - <<EOF
          configs:
            secret:
              argocdServerAdminPassword: "${ADMIN_BCRYPT}"
          server:
            extraArgs:
              - --insecure
            service:
              type: LoadBalancer
              servicePortHttp: 32080
              annotations:
                metallb.io/allow-shared-ip: edge-endpoint
            metrics:
              enabled: true
              serviceMonitor:
                enabled: true
          controller:
            metrics:
              enabled: true
              serviceMonitor:
                enabled: true
          repoServer:
            metrics:
              enabled: true
              serviceMonitor:
                enabled: true
          redis:
            metrics:
              enabled: true
              serviceMonitor:
                enabled: true
          dex:
            enabled: true
            metrics:
              enabled: true
              serviceMonitor:
                enabled: true
          applicationSet:
            enabled: true
            metrics:
              enabled: true
              serviceMonitor:
                enabled: true
          notifications:
            enabled: true
            metrics:
              enabled: true
              serviceMonitor:
                enabled: true
          EOF

  argocd:login:
    desc: Log the Argo CD command line in
    vars:
      IP_ADDRESS:
        sh: ip route get 1.1.1.1 | grep -oP 'src \K[^ ]+'
    cmds:
      - argocd login {{.IP_ADDRESS}}:32080 --insecure --plaintext --username admin --password {{.ARGOCD_ADMIN_PASSWORD}}

  argocd:accounts:
    desc: Create the sysops (admin) and backstage (read-only) accounts
    cmds:
      - |
          kubectl -n argo-cd patch configmap/argocd-cm --type=json --patch '[
            {"op": "add", "path": "/data/accounts.sysops", "value": "apiKey,login"},
            {"op": "add", "path": "/data/accounts.backstage", "value": "apiKey,login"}
          ]'
      - |
          kubectl -n argo-cd patch configmap/argocd-rbac-cm --type=json --patch '[
            {"op": "add", "path": "/data/policy.csv", "value": "g, sysops, role:admin\ng, backstage, role:readonly\n"}
          ]'

  deploy:argocd:
    desc: Deploy Argo CD
    cmds:
      - task: argocd:cli
      - task: argocd:install
      - task: argocd:login
      - task: argocd:accounts
      - touch /ks/.argocd_finished

  deploy:prometheus:
    desc: Deploy the Kube-Prometheus stack with Argo CD
    cmds:
      - argocd app create prometheus --file ${HOME}/deploy/argocd/kube-prometheus.yaml --upsert
      - touch /ks/.prometheus_finished

  deploy:metrics-server:
    desc: Deploy the Metrics Server with Argo CD
    cmds:
      - argocd app create metrics-server --file ${HOME}/deploy/argocd/metrics-server.yaml --upsert
      - touch /ks/.metrics-server_finished

  deploy:webapp:
    desc: Deploy the example web application with Argo CD
    cmds:
      - argocd app create demo --file ${HOME}/deploy/argocd/fastapi-demo.yaml --upsert
      - touch /ks/.webapp_finished

  backstage:create:
    desc: Generate the Backstage application with the latest create-app
    cmds:
      - |
          if [ ! -d ${HOME}/backstage-tutorial ]
          then
            cd ${HOME}
            echo backstage-tutorial | npx --yes @backstage/create-app@latest --skip-install
            cd backstage-tutorial
            yarn install
          fi

  backstage:configure:
    desc: Write app-config.local.yaml (listeners, catalog, Kubernetes, Argo CD)
    vars:
      KC_FRONTEND_URL:
        sh: sed -e 's/PORT/3000/' -e 's/https/http/' /etc/killercoda/host
      KC_BACKEND_URL:
        sh: sed 's/PORT/7007/' /etc/killercoda/host
    cmds:
      - |
          BS_ARGO_TOKEN=$(argocd account generate-token --account backstage)
          cat > ${HOME}/backstage-tutorial/app-config.local.yaml <<EOF
          app:
            listen:
              host: 0.0.0.0
              port: 3000
            baseUrl: {{.KC_FRONTEND_URL}}
          backend:
            listen:
              host: 0.0.0.0
              port: 7007
            baseUrl: {{.KC_BACKEND_URL}}
            cors:
              origin: {{.KC_FRONTEND_URL}}
          catalog:
            locations:
              - type: file
                target: ../../../web-app/catalog-info.yaml
          kubernetes:
            serviceLocatorMethod:
              type: multiTenant
            clusterLocatorMethods:
              - type: localKubectlProxy
          argocd:
            username: admin
            password: {{.ARGOCD_ADMIN_PASSWORD}}
            appLocatorMethods:
              - type: config
                instances:
                  - name: argocd
                    url: http://localhost:32080
                    token: ${BS_ARGO_TOKEN}
          EOF

  backstage:deploy:
    desc: Deploy Backstage in the cluster with Argo CD
    vars:
      KC_FRONTEND_URL:
        sh: sed -e 's/PORT/3000/' -e 's/https/http/' /etc/killercoda/host
      KC_BACKEND_URL:
        sh: sed 's/PORT/7007/' /etc/killercoda/host
    cmds:
      - |
          yq -i '
            .spec.source.helm.valuesObject.backstage.appConfig.app.baseUrl = "{{.KC_BACKEND_URL}}" |
            .spec.source.helm.valuesObject.backstage.appConfig.backend.baseUrl = "{{.KC_BACKEND_URL}}" |
            .spec.source.helm.valuesObject.backstage.appConfig.backend.cors.origin = "{{.KC_BACKEND_URL}}"
          ' ${HOME}/deploy/argocd/backstage.yaml
      - kubectl apply -f ${HOME}/deploy/argocd/backstage-rbac.yaml
      - argocd app create backstage --file ${HOME}/deploy/argocd/backstage.yaml --upsert

  setup:backstage:
    desc: Create, configure and deploy the Backstage tutorial application
    cmds:
      - task: backstage:create
      - task: backstage:configure
      - task: backstage:deploy
      - touch /ks/.backstageapp_finished

  install:docker-buildx:
    desc: Install the Docker BuildX plugin from the Docker apt repository
    cmds:
      - sudo install -m 0755 -d /etc/apt/keyrings
      - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor --yes -o /etc/apt/keyrings/docker.gpg
      - |
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo ${VERSION_CODENAME}) stable" \
            | sudo tee /etc/apt/sources.list.d/docker.list
      - sudo apt-get update -y && sudo apt-get install -y docker-buildx-plugin
      - touch /ks/.docker_finished

  install:bats:
    desc: Install the Bats test framework
    cmds:
      - git clone https://github.com/bats-core/bats-core.git /tmp/bats-core
      - /tmp/bats-core/install.sh /usr/local
      - rm -rf /tmp/bats-core
      - touch /ks/.bats_core_finished

  configure:k3s:
    desc: Make the k3s kubeconfig usable by root
    cmds:
      - |
          if [ -f /etc/rancher/k3s/k3s.yaml ] && [ ! -f /root/.kube/config ]
          then
            sed 's/127\.0\.0\.1/localhost/' /etc/rancher/k3s/k3s.yaml | sudo tee /root/.kube/config
            chmod 600 /root/.kube/config
          fi
      - sudo systemctl restart k3s
      - kubectl delete node ubuntu
      - touch /ks/.kubeconfig_finished
