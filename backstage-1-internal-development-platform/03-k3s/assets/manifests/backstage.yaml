apiVersion: v1
kind: Secret
metadata:
  name: backstage-secrets
  namespace: backstage
type: Opaque
data:
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  GITHUB_TOKEN: "UkVEQUNURUQ="
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: backstage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage
  template:
    metadata:
      labels:
        app: backstage
    spec:
      containers:
        - name: backstage
          image: backstage:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 7007
          envFrom:
            - secretRef:
                name: postgres-secrets
            - secretRef:
                name: backstage-secrets
          resources: {}
        # Uncomment if health checks are enabled in your app:
        # https://backstage.io/docs/plugins/observability#health-checks
         readinessProbe:
           httpGet:
             port: 7007
             path: /healthcheck
         livenessProbe:
           httpGet:
             port: 7007
             path: /healthcheck
---
apiVersion: v1
kind: Service
metadata:
  name: backstage
  namespace: backstage
  labels:
    app: backstage
    component: app
spec:
  selector:
    app: backstage
  type: LoadBalancer
  ports:
    - name: http
      port: 7007
      targetPort: http
