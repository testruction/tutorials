version: '3'

tasks:
  default:
    desc: Provision the tutorial environment
    deps:
      - install:yq
      - install:bats
      - install:nodejs
  install:yq:
    desc: Install the yq command line
    vars:
      YQ_VERSION: 4.46.1
    cmds:
      - "sudo curl -fsSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v{{.YQ_VERSION}}/yq_linux_amd64"
      - "sudo chmod +x /usr/local/bin/yq"
      - "touch /ks/.yq_finished"
    status:
      - test -f /ks/.yq_finished
  install:bats:
    desc: Install the Bats test framework
    cmds:
      - |
          cd /tmp
          git clone https://github.com/bats-core/bats-core.git
          cd bats-core
          ./install.sh /usr/local
          cd ..
          rm -rf bats-core
      - "touch /ks/.bats_core_finished"
    status:
      - test -f /ks/.bats_core_finished
  install:nodejs:
    desc: Install Node.js (LTS) with nvm
    vars:
      NVM_VERSION: 0.40.3
    cmds:
      - |
          bash -s <<'SCRIPT'
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y 'ca-certificates' 'curl' 'gnupg'
          curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v{{.NVM_VERSION}}/install.sh | bash
          export NVM_DIR="$HOME/.nvm"
          . "$NVM_DIR/nvm.sh"
          nvm install --lts
          corepack enable
          echo "export NODE_OPTIONS='--max-old-space-size=1500'" >> "${HOME}/.bashrc"
          SCRIPT
      - "touch /ks/.nodejs_finished"
    status:
      - test -f /ks/.nodejs_finished
