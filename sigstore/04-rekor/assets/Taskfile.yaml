# 04. Sigstore: Rekor - environment provisioning
version: '3'

vars:
  COSIGN_VERSION: 3.1.6
  REKOR_VERSION: 1.6.5

tasks:
  default:
    desc: Provision the tutorial environment
    cmds:
      - task: install:cosign
      - task: install:rekor-cli
      - task: install:jq

  install:cosign:
    desc: Install the cosign command line
    cmds:
      - sudo curl -fsSL -o /usr/local/bin/cosign https://github.com/sigstore/cosign/releases/download/v{{.COSIGN_VERSION}}/cosign-linux-amd64
      - sudo chmod +x /usr/local/bin/cosign
      - touch /ks/.cosign_finished

  install:rekor-cli:
    desc: Install the rekor-cli command line
    cmds:
      - sudo curl -fsSL -o /usr/local/bin/rekor-cli https://github.com/sigstore/rekor/releases/download/v{{.REKOR_VERSION}}/rekor-cli-linux-amd64
      - sudo chmod +x /usr/local/bin/rekor-cli
      - touch /ks/.rekor-cli_finished

  install:jq:
    desc: Install the jq JSON processor
    cmds:
      - sudo apt-get update -y && sudo apt-get install -y jq
      - touch /ks/.jq_finished
