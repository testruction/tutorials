# Sandbox0 - on-demand lab provisioning tasks (run with `task <name>`)
version: '3'

vars:
  DISK_COUNT: 16
  ISCSI_ADDRESS: 127.0.0.1
  ISCSI_PORT: 53260
  ISCSI_IQN: iqn.0000-00.local.host
  ISCSI_USER: iscsi-user
  ISCSI_PASSWORD: random_password
  ISCSI_USER_OUT: iscsi-target
  ISCSI_PASSWORD_OUT: random_password_out
  ISCSI_DEVICE_PREFIX: /dev/disk/by-path/ip-{{.ISCSI_ADDRESS}}:{{.ISCSI_PORT}}-iscsi-{{.ISCSI_IQN}}
  USER_DATA: /tmp/default-user-data.yml
  LXD_CONTAINER: lxd01
  LXC_CONTAINER: host02
  TIMEOUT: 30

tasks:
  default:
    desc: Run the default background initialization
    cmds:
      - task: hello-world

  hello-world:
    desc: Log a message and wait a few seconds
    cmds:
      - logger "Hello world"
      - sleep 3

  install:ssh:
    desc: Install the SSH client, create a key pair and add it to the container user-data
    cmds:
      - sudo apt-get update -y && sudo apt-get install -y openssh-client
      - mkdir -p ${HOME}/.ssh
      - test -f ${HOME}/.ssh/id_rsa || ssh-keygen -q -N '' -f ${HOME}/.ssh/id_rsa -C "$(id -un)@$(hostname)"
      - sed -i "s|__USER_SSH_PUBLIC_KEY__|$(cat ${HOME}/.ssh/id_rsa.pub)|g" {{.USER_DATA}}

  install:lxd:
    desc: Install LXD and start a container
    cmds:
      - sudo apt-get update -y && sudo apt-get install -y lsb-release lxd python3-pylxd python3-openssl
      - sudo lxd init --auto
      - lxc launch "$(lsb_release -is | tr A-Z a-z):$(lsb_release -cs)" {{.LXD_CONTAINER}} --config=user.user-data="$(cat {{.USER_DATA}})"
      - |
          echo "Waiting for {{.LXD_CONTAINER}} to run"
          for i in $(seq 1 {{.TIMEOUT}})
          do
            lxc info {{.LXD_CONTAINER}} | grep -q 'Status: Running' && break
            sleep 1
          done
          lxc info {{.LXD_CONTAINER}} | grep -q 'Status: Running'
      - |
          echo "Waiting for the IP address of {{.LXD_CONTAINER}}"
          for i in $(seq 1 {{.TIMEOUT}})
          do
            IP=$(lxc info {{.LXD_CONTAINER}} | awk '/eth0:.*inet[^6]/ {print $3}')
            test -n "${IP}" && break
            sleep 1
          done
          test -n "${IP}"
          echo "${IP} {{.LXD_CONTAINER}}" | sudo tee -a /etc/hosts

  install:lxc:
    desc: Install LXC and start a container
    cmds:
      - sudo apt-get update -y && sudo apt-get install -y lsb-release openssh-server lxc lxd python3-pylxd python3-openssl
      - lxc-checkconfig
      - echo "$(id -un) veth lxcbr0 10" | sudo tee -a /etc/lxc/lxc-usernet
      - mkdir -p ${HOME}/.config/lxc
      - cp /etc/lxc/default.conf ${HOME}/.config/lxc/default.conf
      - |
          # Non-root users map their sub-uid/gid ranges into the container
          if [ "$(id -un)" != root ]
          then
            for kind in u g
            do
              file=/etc/sub${kind}id
              echo "lxc.idmap = ${kind} 0 $(grep "$(id -un)" ${file} | cut -d : -f 2) $(grep "$(id -un)" ${file} | cut -d : -f 3)" \
                | tee -a ${HOME}/.config/lxc/default.conf
            done
          fi
      - chmod +x ${HOME} ${HOME}/.local ${HOME}/.local/share ${HOME}/.local/share/lxc
      - |
          DIST=$(lsb_release -is | tr A-Z a-z)
          RELEASE=$(lsb_release -cs)
          if [ "$(id -un)" = root ]
          then
            sudo lxc-create --template download --name {{.LXC_CONTAINER}} -- --dist ${DIST} --release ${RELEASE} --arch amd64
            sudo lxc-start {{.LXC_CONTAINER}}
            sudo lxc-info {{.LXC_CONTAINER}} -iH
          else
            systemd-run --unit=my-unit --user --scope -p Delegate=yes -- \
              lxc-create --template download --name {{.LXC_CONTAINER}} -- --dist ${DIST} --release ${RELEASE} --arch amd64
            lxc-start --name {{.LXC_CONTAINER}}
            lxc-info --name {{.LXC_CONTAINER}} --ips --no-humanize
          fi

  install:iscsi:
    desc: Create {{.DISK_COUNT}} iSCSI disks served by tgt and attach them with open-iscsi
    summary: |
      Set the number of 512MB disks with DISK_COUNT (default 16), e.g. `task install:iscsi DISK_COUNT=4`.
    cmds:
      - task: iscsi:packages
      - task: iscsi:target
      - task: iscsi:initiator
      - task: iscsi:partitions

  iscsi:packages:
    desc: Install the iSCSI target (tgt) and initiator (open-iscsi)
    cmds:
      - sudo apt-get update -y && sudo apt-get install -y tgt open-iscsi

  iscsi:target:
    desc: Create the disk images, the CHAP protected targets and the tgt service
    cmds:
      - |
          # One 512MB image and one target per disk, only reachable from localhost
          sudo mkdir -p /var/lib/devices
          for i in $(seq 1 {{.DISK_COUNT}})
          do
            sudo fallocate -l 512MB /var/lib/devices/disk-$(printf %03d ${i}).img
            cat <<EOF | sudo tee -a /etc/tgt/conf.d/killercoda_iscsi.conf
          <target {{.ISCSI_IQN}}:lun$((i - 1))>
            backing-store /var/lib/devices/disk-$(printf %03d ${i}).img
            initiator-address {{.ISCSI_ADDRESS}}
            incominguser {{.ISCSI_USER}} {{.ISCSI_PASSWORD}}
            outgoinguser {{.ISCSI_USER_OUT}} {{.ISCSI_PASSWORD_OUT}}
          </target>
          EOF
          done
      - |
          # The portal listens on localhost and a non-default port only
          cat <<EOF | sudo tee /etc/systemd/system/tgt.service
          [Unit]
          Description=(i)SCSI target daemon
          Documentation=man:tgtd(8)
          After=network.target

          [Service]
          Type=notify
          TasksMax=infinity
          ExecStart=/usr/sbin/tgtd -f
          ExecStartPost=/usr/sbin/tgtadm --op update --mode sys --name State -v offline
          ExecStartPost=/usr/sbin/tgt-admin -e -c /etc/tgt/targets.conf
          ExecStartPost=/usr/sbin/tgtadm --mode portal --op delete --mode portal --param portal=0.0.0.0:3260
          ExecStartPost=/usr/sbin/tgtadm --mode portal --op delete --mode portal --param portal=[::]:3260
          ExecStartPost=/usr/sbin/tgtadm --mode portal --op new --mode portal --param portal={{.ISCSI_ADDRESS}}:{{.ISCSI_PORT}}
          ExecStartPost=/usr/sbin/tgtadm --op update --mode sys --name State -v ready
          ExecStop=/usr/sbin/tgtadm --op update --mode sys --name State -v offline
          ExecStop=/usr/sbin/tgt-admin --offline ALL
          ExecStop=/usr/sbin/tgt-admin --update ALL -c /dev/null -f
          ExecStop=/usr/sbin/tgtadm --op delete --mode system
          ExecReload=/usr/sbin/tgt-admin --update ALL -c /etc/tgt/targets.conf
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
          EOF
      - sudo systemctl daemon-reload
      - sudo systemctl enable tgt.service
      - sudo systemctl restart tgt.service
      - sleep 5
      - sudo tgtadm --mode target --op show

  iscsi:initiator:
    desc: Discover the targets, set their CHAP credentials and log in at boot
    cmds:
      - sudo iscsiadm -m discovery -t st -p {{.ISCSI_ADDRESS}}:{{.ISCSI_PORT}}
      - |
          for i in $(seq 1 {{.DISK_COUNT}})
          do
            node=/etc/iscsi/nodes/{{.ISCSI_IQN}}:lun$((i - 1))/{{.ISCSI_ADDRESS}},{{.ISCSI_PORT}},1/default
            cat <<EOF | sudo tee -a ${node}
          node.session.auth.authmethod = CHAP
          node.session.auth.username = {{.ISCSI_USER}}
          node.session.auth.password = {{.ISCSI_PASSWORD}}
          node.session.auth.username_in = {{.ISCSI_USER_OUT}}
          node.session.auth.password_in = {{.ISCSI_PASSWORD_OUT}}
          EOF
            sudo sed -i 's/node.startup = manual/node.startup = automatic/' ${node}
          done
      - sudo systemctl daemon-reload
      - sudo systemctl enable open-iscsi
      - sudo systemctl restart open-iscsi

  iscsi:partitions:
    desc: Wait for the disks, then create one ext4 partition on each
    cmds:
      - |
          until [ "$(ls {{.ISCSI_DEVICE_PREFIX}}:lun*-lun-? 2>/dev/null | wc -l)" -eq {{.DISK_COUNT}} ]
          do
            sleep 1
          done
      - |
          for i in $(seq 1 {{.DISK_COUNT}})
          do
            disk={{.ISCSI_DEVICE_PREFIX}}:lun$((i - 1))-lun-1
            sudo parted -s ${disk} mklabel msdos
            sudo parted -s ${disk} unit % mkpart primary ext4 0 100
            partprobe -s > /dev/null 2>&1 && sleep 1
            sudo mkfs -t ext4 ${disk}-part1
          done
      - lsblk --scsi

  write:localusers:
    desc: Create the lab groups and users; the result is listed in /var/cache/generated_users
    cmds:
      - |
          for group in sysops devops finops secops
          do
            groupadd ${group}
          done
      - |
          # Each user gets one random group and the dash shell
          groups=(sysops devops finops secops)
          for user in serena ronaldo ken fatima
          do
            group=${groups[$((RANDOM % ${#groups[@]}))]}
            useradd --no-user-group --create-home --shell=/bin/dash --groups=${group} ${user}
            echo "${user} /bin/dash ${group}" | tee -a /var/cache/generated_users
          done
          echo "root /bin/bash root" | tee -a /var/cache/generated_users

  write:files:
    desc: Generate 2000 files in /var/lib/lab1 with random mode, size, attribute and owner
    cmds:
      - sudo apt-get update -y && sudo apt-get install -y uuid-runtime util-linux
      - mkdir -p /var/lib/lab1
      - chmod 777 /var/lib/lab1
      - |
          sizes=(32K 64K 128K 256K 512K 1024K)
          attrs=(+a -a +i -i +A -A)
          for i in $(seq 1 2000)
          do
            file=/var/lib/lab1/$(uuidgen)
            size=${sizes[$((RANDOM % ${#sizes[@]}))]}
            attr=${attrs[$((RANDOM % ${#attrs[@]}))]}
            # Mode digits: special bits (0, 1 sticky or 2 setgid) then user, group and other (0-7)
            mode=$((RANDOM % 3))$((RANDOM % 8))$((RANDOM % 8))$((RANDOM % 8))
            fallocate -l ${size} ${file}
            # Owned by a random user of /var/cache/generated_users, when write:localusers ran before
            if [ -f /var/cache/generated_users ]
            then
              owner=$(shuf -n 1 /var/cache/generated_users | awk '{print $1 ":" $3}')
              chown ${owner} ${file}
            fi
            chmod ${mode} ${file}
            chattr ${attr} ${file}
            echo "${i} ${file} ${size} ${mode} ${attr} ${owner:-}" | tee -a /var/cache/generated_files
          done

  install:salt:
    desc: Install a standalone (masterless) Salt minion
    cmds:
      - sudo mkdir -p /etc/apt/keyrings
      - sudo curl -fsSL -o /etc/apt/keyrings/salt-archive-keyring.gpg https://repo.saltproject.io/py3/ubuntu/$(lsb_release -sr)/amd64/latest/salt-archive-keyring.gpg
      - |
          echo "deb [signed-by=/etc/apt/keyrings/salt-archive-keyring.gpg arch=amd64] https://repo.saltproject.io/py3/ubuntu/$(lsb_release -sr)/amd64/latest $(lsb_release -sc) main" \
            | sudo tee /etc/apt/sources.list.d/salt.list
      - sudo apt-get update -y && sudo apt-get install -y git libssl-dev python3-pip salt-minion
      - |
          echo "file_client: local" | sudo tee /etc/salt/minion.d/00-local.conf
      - sudo systemctl enable salt-minion
      - sudo systemctl restart salt-minion
