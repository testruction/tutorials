version: '3'

tasks:
  default:
    desc: Run the default background initialization
    cmds:
      - task: hello-world
  hello-world:
    desc: Log a message and wait a few seconds
    cmds:
      - "logger \"Hello world\""
      - "sleep 3"
  install:ssh:
    desc: Install the SSH client and generate the user key pair
    cmds:
      - |
          bash -s <<'SCRIPT'
          set -e

          function install_dependencies()
          {
              sudo apt-get update -y \
              && apt-get install -y \
                 'openssh-client'
          }

          function generate_keys()
          {
              USER_NAME=$(id -un)
              HOST_NAME=$(hostname)
              SSH_KEY_FILE="/root/.ssh/id_rsa"
              if [ ! "$(id -un)" = "root" ]
              then
                  SSH_KEY_FILE="${HOME}/.ssh/id_rsa"
              fi
              
              if [ ! -f "${SSH_KEY_FILE}" ]; then
                  ssh-keygen -f "${SSH_KEY_FILE}" -C "${USER_NAME}@${HOST_NAME}" -q -N ''
              fi
          }

          function udpate_user_data()
          {
              SSH_PUB_KEY_FILE="/root/.ssh/id_rsa.pub"
              if [ ! "$(id -un)" = "root" ]
              then
                  SSH_PUB_KEY_FILE="${HOME}/.ssh/id_rsa.pub"
              fi
              
              if [ -f "/tmp/default-user-data.yml" ] && [ -f "${SSH_PUB_KEY_FILE}" ]; then
                  sed -i "s|__USER_SSH_PUBLIC_KEY__|$(cat $SSH_PUB_KEY_FILE)|g" /tmp/default-user-data.yml
              fi
          }

          install_dependencies
          generate_keys
          udpate_user_data
          SCRIPT
  install:lxd:
    desc: Install LXD and start a container
    cmds:
      - |
          bash -s <<'SCRIPT'
          set -e

          # install lxc and lxd
          function install_dependencies()
          {
              sudo apt-get update -y \
              && apt-get install -y \
                 'lsb-release' \
                 'lxd' \
                 'python3-pylxd' \
                 'python3-openssl'
          }

          # Initialize LXD
          function configure_lxd()
          {
              export DOWNLOAD_KEYSERVER="hkp://keyserver.ubuntu.com"

              sudo lxd init --auto
              
          }

          function waitfor_container()
          {
            container_name="${1}"
            retry="${2:-'15'}"
            count=0

            state="Unstated yet"

            while [ "${state}" != "Running" ]
            do
              state="$(lxc info ${container_name} | grep "Status" | cut -d ' ' -f 2)"

              logger -p syslog.notice \
              "Waiting for \"${container_name}\". Current state \"${state}\""

              if [ ${count} -ge ${retry} ]
              then
                  logger -p syslog.error \
                  "Abandoning for \"${container_name}\". Current state \"${state}\". Reason: \"Timeout\""
                  exit 1
              fi

              ((count=count+1))
              sleep 1s
            done

            logger -p syslog.info \
            "Ready for \"${container_name}\". Current state \"${state}\""
          }

          function waitfor_container_ip()
          {
            container_name="${1}"
            retry="${2:-'15'}"
            count=0

            ip=""

            while [ "${ip}" == "" ]
            do
              ip=$(lxc info "${container_name}" | grep -E "eth0\:\sinet\s.*" | awk -F " " '{print $3}')

              if [ "${ip}" != "" ]
              then
                  logger -p syslog.info \
                  "Adding record to \"${ip} ${container_name}\" to \"/etc/hosts\""
                  echo "${ip} ${container_name}" | sudo tee -a /etc/hosts
              fi
              
              if [ ${count} -ge ${retry} ]
              then
                  logger -p syslog.error \
                  "Abandoning for \"${container_name}\". Current IP address \"${ip}\". Reason: \"Timeout\""
                  exit 1
              fi

              ((count=count+1))
              sleep 1s
            done

            logger -p syslog.info \
            "Ready for \"${container_name}\". Current state \"${state}\""
          }

          function start_container()
          {
              CONTAINER_NAME="${1:-'u1'}"
              USER_DATA=${2:-'/tmp/default-user-data.yml'}
              TIMEOUT="${3:-'15'}"
              DISTRIBUTION=$(lsb_release -is)
              RELEASE=$(lsb_release -cs)

              if [ "$(id -un)" = "root" ]
              then
                  lxc launch "${DISTRIBUTION,,}:${RELEASE}" "${CONTAINER_NAME}" --config=user.user-data="$(cat ${USER_DATA})" --verbose

                  waitfor_container ${CONTAINER_NAME} ${TIMEOUT}
                  waitfor_container_ip ${CONTAINER_NAME} ${TIMEOUT}
              fi
          }

          install_dependencies
          configure_lxd
          start_container 'lxd01' /tmp/default-user-data.yml 30
          SCRIPT
  install:lxc:
    desc: Install LXC and start a container
    cmds:
      - |
          bash -s <<'SCRIPT'

          set -e
          # install lxc and lxd
          function install_dependencies()
          {
              sudo apt-get update -y \
              && apt-get install -y \
                 'lsb-release' \
                 'openssh-server' \
                 'lxc' \
                 'lxd' \
                 'python3-pylxd' \
                 'python3-openssl'
          }

          function configure_veth()
          {
              lxc-checkconfig
              echo "$(id -un) veth lxcbr0 10" | sudo tee -a /etc/lxc/lxc-usernet
          }

          function configure_lxc()
          {
              mkdir -p ~/.config/lxc

              cp /etc/lxc/default.conf ~/.config/lxc/default.conf

              if [ ! "$(id -un)" = "root" ]
              then
                  MS_UID="$(grep "$(id -un)" /etc/subuid  | cut -d : -f 2)"
                  ME_UID="$(grep "$(id -un)" /etc/subuid  | cut -d : -f 3)"
                  MS_GID="$(grep "$(id -un)" /etc/subgid  | cut -d : -f 2)"
                  ME_GID="$(grep "$(id -un)" /etc/subgid  | cut -d : -f 3)"

                  echo "lxc.idmap = u 0 $MS_UID $ME_UID" | tee -a ~/.config/lxc/default.conf
                  echo "lxc.idmap = g 0 $MS_GID $ME_GID" | tee -a ~/.config/lxc/default.conf
              fi

              export DOWNLOAD_KEYSERVER="hkp://keyserver.ubuntu.com"
          }

          function start_containers()
          {
              DISTRIBUTION=$(lsb_release -is)
              RELEASE=$(lsb_release -cs)
              
              chmod +x ~/ ~/.local ~/.local/share ~/.local/share/lxc

              if [ "$(id -un)" = "root" ]
              then
                  sudo lxc-create --template download --name host02 -- --dist ${DISTRIBUTION,,} --release "${RELEASE}" --arch amd64 \
                  && sudo lxc-start host02 \
                  && sudo lxc-info host02 -iH
              else
                  systemd-run --unit=my-unit --user --scope -p "Delegate=yes" -- lxc-create --template download --name host02 -- --dist ${DISTRIBUTION,,} --release "${RELEASE}" --arch amd64 \
                  && lxc-start --name host02 \
                  && lxc-info --name host02 --ips --no-humanize
              fi
          }

          install_dependencies
          configure_veth
          configure_lxc
          start_containers
          SCRIPT
  install:iscsi:
    desc: Install an iSCSI target and initiator with virtual disks
    summary: >
      Number of 512MB disks is set with `DISK_COUNT` (default: 16),
      e.g. `task install:iscsi DISK_COUNT=4`
    env:
      DISK_COUNT: "{{.DISK_COUNT | default 16}}"
    cmds:
      - |
          bash -s <<'SCRIPT'
          set -e

          DISK_COUNT="${DISK_COUNT:-16}"
          TARGET_ADDRESS='127.0.0.1'
          TARGET_PORT='53260'
          TARGET_IQN='iqn.0000-00.local.host'
          INCOMING_USER='iscsi-user'
          INCOMING_PASSWORD='random_password'
          OUTGOING_USER='iscsi-target'
          OUTGOING_PASSWORD='random_password_out'


          function install_dependencies()
          {
            # install tgt and open-iscsi
            sudo apt-get update -y \
            && sudo apt-get install -y tgt open-iscsi
          }

          function configure_target()
          {
            for i in $(seq 1 ${DISK_COUNT})
            do
              disk_id="$(printf "%03d" ${i})"
              lun_name="lun$((${i} - 1))"
              # assume we have want to store our iscsi disk image
              # at /var/lib/devices and use a 10G disk.
              # create the disk image
              sudo mkdir -p /var/lib/devices
              sudo fallocate -l 512MB /var/lib/devices/disk-${disk_id}.img \
              || logger -p syslog.error -p syslog.error \
                "Failed to create disk image \"/var/lib/devices/disk-${disk_id}.img\""

              # configure iscsi tgt
              # we use CHAP authentication (bidirectional) and set the initiator 
              # address to only allow localhost to enhance iscsi security
              cat <<EOF | sudo tee -a /etc/tgt/conf.d/killercoda_iscsi.conf
          <target ${TARGET_IQN}:${lun_name}>
            backing-store /var/lib/devices/disk-${disk_id}.img
            initiator-address ${TARGET_ADDRESS}
            incominguser ${INCOMING_USER} ${INCOMING_PASSWORD}
            outgoinguser ${OUTGOING_USER} ${OUTGOING_PASSWORD}
          </target>
          EOF
            done

            cat <<EOF | sudo tee /etc/systemd/system/tgt.service
          [Unit]
          Description=(i)SCSI target daemon
          Documentation=man:tgtd(8)
          After=network.target

          [Service]
          Type=notify
          TasksMax=infinity
          ExecStart=/usr/sbin/tgtd -f
          ExecStartPost=/usr/sbin/tgtadm --op update --mode sys --name State -v offline
          ExecStartPost=/usr/sbin/tgt-admin -e -c /etc/tgt/targets.conf

          ExecStartPost=/usr/sbin/tgtadm --mode portal --op delete --mode portal --param portal=0.0.0.0:3260
          ExecStartPost=/usr/sbin/tgtadm --mode portal --op delete --mode portal --param portal=[::]:3260
          ExecStartPost=/usr/sbin/tgtadm --mode portal --op new --mode portal --param portal=${TARGET_ADDRESS}:${TARGET_PORT}

          ExecStartPost=/usr/sbin/tgtadm --op update --mode sys --name State -v ready

          ExecStop=/usr/sbin/tgtadm --op update --mode sys --name State -v offline
          ExecStop=/usr/sbin/tgt-admin --offline ALL
          ExecStop=/usr/sbin/tgt-admin --update ALL -c /dev/null -f
          ExecStop=/usr/sbin/tgtadm --op delete --mode system

          ExecReload=/usr/sbin/tgt-admin --update ALL -c /etc/tgt/targets.conf
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
          EOF

            # enable iscsi tgt service
            sudo systemctl daemon-reload
            sudo systemctl enable tgt.service
            sudo systemctl restart tgt.service

            sleep 5s

            # optionally, verify the target is working
            sudo tgtadm --mode target --op show
          }


          function configure_initiator()
          {
            # generate node configuration files
            sudo iscsiadm -m discovery -t st -p ${TARGET_ADDRESS}:${TARGET_PORT}

            for i in $(seq 1 ${DISK_COUNT})
            do
              disk_id="$(printf "%03d" ${i})"
              lun_name="lun$((${i} - 1))"
              # configure iscsi initiator
              cat <<EOF | tee -a /etc/iscsi/nodes/${TARGET_IQN}\:${lun_name}/${TARGET_ADDRESS}\,${TARGET_PORT}\,1/default
          node.session.auth.authmethod = CHAP
          node.session.auth.username = ${INCOMING_USER}
          node.session.auth.password = ${INCOMING_PASSWORD}
          node.session.auth.username_in = ${OUTGOING_USER}
          node.session.auth.password_in = ${OUTGOING_PASSWORD}
          EOF

              # enable automatic startup and the systemd service
              sed -i 's/node.startup = manual/node.startup = automatic/g' /etc/iscsi/nodes/${TARGET_IQN}\:${lun_name}/${TARGET_ADDRESS}\,${TARGET_PORT}\,1/default
            done

            sudo systemctl daemon-reload
            sudo systemctl enable open-iscsi
            sudo systemctl restart open-iscsi
          }

          # wait for open-iscsi to create virtual devices
          function find_devs()
          {
            find /dev/disk/by-path/ -name "ip-${TARGET_ADDRESS}\:${TARGET_PORT}-iscsi-${TARGET_IQN}\:lun*-lun-?"
          }


          function waitfor_devs()
          {
            while [ "$(find_devs | wc -l)" -ne "${DISK_COUNT}" ]
            do
              logger -p syslog.notice \
              "Discovered new virtual devices in \"/dev\" [$(find_devs | wc -l)/${DISK_COUNT}]"
            done

            logger -p syslog.info \
            "Ready ISCSI virtual devices in \"/dev\" [$(find_devs | wc -l)/${DISK_COUNT}]"
          }


          # format & partition disk
          function add_partitions()
          {
            for i in $(seq 1 ${DISK_COUNT})
            do
              lun_name="lun$((${i} - 1))"
              
              # create label
              sudo parted -s /dev/disk/by-path/ip-${TARGET_ADDRESS}\:${TARGET_PORT}-iscsi-${TARGET_IQN}\:${lun_name}-lun-1 mklabel msdos
              sudo parted -s /dev/disk/by-path/ip-${TARGET_ADDRESS}\:${TARGET_PORT}-iscsi-${TARGET_IQN}\:${lun_name}-lun-1 unit % mkpart primary ext4 0 100
              partprobe -s > /dev/null 2>&1 && sleep 1s
              sudo mkfs -t ext4 /dev/disk/by-path/ip-${TARGET_ADDRESS}\:${TARGET_PORT}-iscsi-${TARGET_IQN}\:${lun_name}-lun-1-part1
            done

            lsblk --scsi
          }

          install_dependencies
          configure_target
          configure_initiator
          waitfor_devs
          add_partitions
          SCRIPT
  write:localusers:
    desc: Create the lab local users and groups
    cmds:
      - |
          bash -s <<'SCRIPT'

          set -e

          # User accounts
          USERNAME[0]='serena'
          USERNAME[1]='ronaldo'
          USERNAME[2]='ken'
          USERNAME[3]='fatima'

          GROUPNAME[0]='sysops'
          GROUPNAME[1]='devops'
          GROUPNAME[2]='finops'
          GROUPNAME[3]='secops'

          SHELLPATH='/bin/bash'
          SHELLPATH='/bin/sh'
          SHELLPATH='/bin/dash'

          function create_users()
          {
              for g in ${GROUPNAME[@]}
              do
                  groupadd "${g}"
              done

              for u in ${USERNAME[@]}
              do
                  s=$((RANDOM % ${#SHELLPATH[@]}))
                  shell="${SHELLPATH[$s]}"

                  g=$((RANDOM % ${#GROUPNAME[@]}))
                  group="${GROUPNAME[$g]}"

                  useradd --no-user-group --create-home --shell="${shell}" --groups="${group}" "${u}"

                  echo "${u} ${shell} ${group}" | tee -a /var/cache/generated_users
              done

              echo "root /bin/bash root" | tee -a /var/cache/generated_users
          }

          create_users
          SCRIPT
  write:files:
    desc: Generate the lab files with random modes, sizes and attributes
    cmds:
      - |
          bash -s <<'SCRIPT'

          set -e

          function install_dependencies()
          {
              # install tgt and open-iscsi
              sudo apt-get update -y \
              && sudo apt-get install -y \
                 'uuid-runtime' \
                 'util-linux'
          }

          function create_lab1_files()
          {
              # MODE
              mode[0]='0' # None
              mode[1]='1' # Execute
              mode[2]='2' # Write only
              mode[3]='3' # Write + Excecute
              mode[4]='4' # Read only
              mode[5]='5' # Read + Execute
              mode[6]='6' # Read + Write
              mode[7]='7' # Write + Read + Execute

              # SGID/SGIS
              sugid[0]='0' # None
              sugid[1]='2' # SUID
              sugid[2]='4' # SUID
              sugid[2]='6' # SUID + SGID

              # File size
              size[0]=32K
              size[1]=64K
              size[2]=128K
              size[3]=256K
              size[4]=512K
              size[5]=1024K

              # Attributes
              # A file with the 'a' attribute set can only be opened in append mode for writing.
              # Only the superuser or a process possessing the CAP_LINUX_IMMUTABLE capability can set or clear this attribute.
              attr[0]=+a
              attr[1]=-a
              # A file with the 'a' attribute set can only be opened in append mode for writing.
              # Only the superuser or a process possessing the CAP_LINUX_IMMUTABLE capability can set or clear this attribute.
              attr[2]=+i
              attr[3]=-i
              # A file with the 'd' attribute set is not a candidate for backup when the dump(8) program is run.
              attr[4]=+d
              attr[5]=-d
              # When a file with the 'A' attribute set is accessed, its atime record is not modified.
              # This avoids a certain amount of disk I/O for laptop systems.
              attr[4]=+A
              attr[5]=-A

              mkdir -vp /var/lib/lab1
              chmod -R 777 /var/lib/lab1

              for i in {1..2000}
              do
                  u=$((RANDOM % ${#mode[@]}))
                  g=$((RANDOM % ${#mode[@]}))
                  o=$((RANDOM % ${#mode[@]}))
                  s=$((RANDOM % ${#sugid[@]}))
                  fmode="${mode[$s]}${mode[$u]}${mode[$g]}${mode[$o]}"
                  
                  z=$((RANDOM % ${#size[@]}))
                  fsize="${size[$z]}"

                  a=$((RANDOM % ${#attr[@]}))
                  fattr="${attr[$a]}"

                  fname="/var/lib/lab1/$(uuidgen)"

                  if [ -f /var/cache/generated_users ]
                  then
                      owner=$(shuf -n 1 /var/cache/generated_users | awk -F " " '{OFS = ":"}{print $1, $3}')
                      
                      fallocate -l ${fsize} ${fname}
                      chown "${owner}" ${fname}
                      chmod ${fmode} ${fname}
                      chattr ${fattr} ${fname}

                      echo "${i} ${fname} ${fsize} ${fmode} ${fattr} ${owner}" | tee -a /var/cache/generated_files
                  else
                      fallocate -l ${fsize} ${fname}
                      chmod ${fmode} ${fname}
                      chattr ${fattr} ${fname}

                      echo "${i} ${fname} ${fsize} ${fmode} ${fattr}" | tee -a /var/cache/generated_files
                  fi
              done
          }

          install_dependencies
          create_lab1_files
          SCRIPT
  install:salt:
    desc: Install a standalone Salt minion
    cmds:
      - "sudo mkdir -p /etc/apt/keyrings"
      - "sudo curl -fsSL -o /etc/apt/keyrings/salt-archive-keyring.gpg \"https://repo.saltproject.io/py3/ubuntu/$(lsb_release -sr)/amd64/latest/salt-archive-keyring.gpg\""
      - |
          cat <<EOF | sudo tee /etc/apt/sources.list.d/salt.list
          deb [signed-by=/etc/apt/keyrings/salt-archive-keyring.gpg arch=amd64] https://repo.saltproject.io/py3/ubuntu/$(lsb_release -sr)/amd64/latest $(lsb_release -sc) main
          EOF
      - "sudo apt-get update -y && sudo apt-get install -y git libssl-dev python3-pip salt-minion"
      - |
          cat <<EOF | sudo tee /etc/salt/minion.d/00-local.conf
          file_client: local
          EOF
      - "sudo systemctl enable salt-minion"
      - "sudo systemctl restart salt-minion"
